<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataVotoCesf - Votação</title>

  <style>
    /* ===== Estilo da página (CSS) ===== */
    body { font-family: Arial, sans-serif; background: #f0f2f8; color: #1b2340; margin: 0; line-height: 1.5; }

    header { background: #2a3fd8; color: white; padding: 1rem; }
    header a { color: white; margin-right: 1rem; }

    main { max-width: 700px; margin: 1.5rem auto; padding: 0 1rem; }

    .caixa { background: white; border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }

    /* Aviso amarelo no topo */
    .aviso { background: #ffe9a6; border-radius: 8px; padding: .8rem; }

    fieldset { border: 0; padding: 0; margin: 0 0 1rem 0; }
    legend { font-weight: bold; margin-bottom: .4rem; }

    .opcao { display: block; padding: .8rem; border: 1px solid #dde1f0; border-radius: 8px; margin: .4rem 0; cursor: pointer; }
    .opcao:hover { background: #eef0ff; }
    .opcao input { margin-right: .6rem; }

    /* Botões */
    button { border: 0; padding: .8rem 1.4rem; border-radius: 8px; font-size: 1rem; cursor: pointer; color: white; margin-right: .5rem; }
    .corrigir  { background: #e8782a; }
    .confirmar { background: #17935a; }

    footer { text-align: center; color: #667; padding: 1.5rem; font-size: .9rem; }
  </style>
</head>

<body>

  <header>
    <h1>DataVotoCesf</h1>
    <a href="index.html">Pesquisa</a>
    <a href="voto.html">Votar</a>
  </header>

  <main>
    <h2>Votação simulada</h2>
    <p class="aviso">Isto é uma simulação feita para a pesquisa da escola. Não vale como voto de verdade.</p>

    <!-- O JavaScript vai ler a opção marcada e salvar no Firebase -->
    <form id="form-voto" class="caixa">
      <fieldset>
        <!-- Troque o cargo e os candidatos pelos da sua simulação (os nomes abaixo são de exemplo) -->
        <legend>Em quem você votaria para: Cargo em disputa?</legend>

        <label class="opcao"><input type="radio" name="voto" value="01" required> 01 - Candidato A</label>
        <label class="opcao"><input type="radio" name="voto" value="02"> 02 - Candidata B</label>
        <label class="opcao"><input type="radio" name="voto" value="03"> 03 - Candidato C</label>
        <label class="opcao"><input type="radio" name="voto" value="branco"> Voto em branco</label>
        <label class="opcao"><input type="radio" name="voto" value="nulo"> Voto nulo</label>
      </fieldset>

      <!-- type="reset" limpa a escolha -->
      <button type="reset" class="corrigir">Corrigir</button>
      <button type="submit" class="confirmar">Confirmar voto</button>
    </form>
  </main>

  <footer>
    Colégio Sagrada Família - Campo Largo/PR |
    <a href="admin.html">Área restrita</a>
  </footer>

  <!-- <script type="module" src="script.js"></script> -->
</body>
</html>
